<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כתובת למשלוח</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Heebo', sans-serif;
      background: transparent;
      direction: rtl;
    }

    .address-widget {
      max-width: 100%;
      padding: 8px 4px;
    }

    .field-group {
      margin-bottom: 14px;
      position: relative;
    }

    .field-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #1a1a2e;
      margin-bottom: 5px;
    }

    .field-group label .required {
      color: #e63946;
      margin-right: 2px;
    }

    .field-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d0d5dd;
      border-radius: 8px;
      font-size: 15px;
      font-family: 'Heebo', sans-serif;
      color: #1a1a2e;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field-group input:focus {
      border-color: #0a59eb;
      box-shadow: 0 0 0 3px rgba(10, 89, 235, 0.1);
    }

    .field-group input.valid {
      border-color: #2ecc71;
      background: #f0fff4;
    }

    .field-group input::placeholder {
      color: #a0a0b0;
      font-weight: 300;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .field-group { flex: 1; }
    .row .field-group.small { flex: 0 0 100px; }

    .suggestions {
      position: absolute;
      top: 100%;
      right: 0;
      left: 0;
      background: #fff;
      border: 1.5px solid #d0d5dd;
      border-top: none;
      border-radius: 0 0 8px 8px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .suggestions.active { display: block; }

    .suggestions .item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      color: #1a1a2e;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.15s;
    }

    .suggestions .item:hover,
    .suggestions .item.highlighted {
      background: #eef4ff;
    }

    .suggestions .item:last-child { border-bottom: none; }

    .suggestions .item .match {
      font-weight: 700;
      color: #0a59eb;
    }

    .suggestions .no-results {
      padding: 12px 14px;
      color: #999;
      font-size: 13px;
      text-align: center;
    }

    .suggestions .loading {
      padding: 12px 14px;
      color: #666;
      font-size: 13px;
      text-align: center;
    }

    .status-bar {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    .status-bar.success {
      display: block;
      background: #f0fff4;
      color: #2d6a4f;
      border: 1px solid #b7e4c7;
    }

    .suggestions::-webkit-scrollbar { width: 6px; }
    .suggestions::-webkit-scrollbar-track { background: transparent; }
    .suggestions::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    @media (max-width: 400px) {
      .row { flex-direction: column; gap: 0; }
      .row .field-group.small { flex: 1; }
    }
  </style>
</head>
<body>

<div class="address-widget" id="addressWidget">
  <div class="field-group">
    <label><span class="required">*</span> עיר / יישוב</label>
    <input type="text" id="cityInput" placeholder="טוען ערים..." autocomplete="off" disabled />
    <div class="suggestions" id="citySuggestions"></div>
  </div>

  <div class="field-group">
    <label><span class="required">*</span> רחוב</label>
    <input type="text" id="streetInput" placeholder="בחר עיר קודם..." autocomplete="off" disabled />
    <div class="suggestions" id="streetSuggestions"></div>
  </div>

  <div class="row">
    <div class="field-group">
      <label><span class="required">*</span> מספר בית</label>
      <input type="text" id="houseInput" placeholder="מספר בית" autocomplete="off" />
    </div>
    <div class="field-group small">
      <label>דירה</label>
      <input type="text" id="apartmentInput" placeholder="דירה" autocomplete="off" />
    </div>
  </div>

  <div class="status-bar" id="statusBar"></div>
</div>

<script>
  const GOV_API = 'https://data.gov.il/api/3/action/datastore_search';
  const STREETS_RESOURCE = '9ad3862c-8391-4b2f-84a4-2d4c68625f4b';
  const INSTANCE = new URLSearchParams(window.location.search).get('instance') || 'default';

  // trimmedCity → rawCity (as stored in DB, with trailing spaces)
  let cityRawMap = {};
  let allCities = [];
  let currentCityStreets = [];
  let selectedCity = '';
  let selectedStreet = '';
  let highlightIndex = -1;
  let citiesLoaded = false;
  let alreadyPrefilled = false;

  const cityInput = document.getElementById('cityInput');
  const streetInput = document.getElementById('streetInput');
  const houseInput = document.getElementById('houseInput');
  const apartmentInput = document.getElementById('apartmentInput');
  const citySuggestions = document.getElementById('citySuggestions');
  const streetSuggestions = document.getElementById('streetSuggestions');
  const statusBar = document.getElementById('statusBar');

  // =============================================
  // LOCALSTORAGE + BROADCAST
  // =============================================

  function saveToStorage() {
    const data = {
      city: selectedCity || cityInput.value.trim(),
      street: selectedStreet || streetInput.value.trim(),
      house: houseInput.value.trim(),
      apartment: apartmentInput.value.trim(),
      cityValidated: !!selectedCity,
      streetValidated: !!selectedStreet
    };
    try {
      localStorage.setItem(`address_${INSTANCE}`, JSON.stringify(data));
      if (INSTANCE === 'main' && channel) {
        channel.postMessage(data);
      }
    } catch (e) { /* ignore */ }
  }

  let channel = null;
  try { channel = new BroadcastChannel('address_sync'); } catch (e) {}

  if (INSTANCE === 'delivery' && channel) {
    channel.onmessage = (e) => {
      if (e.data && e.data.city && !alreadyPrefilled) applyPrefill(e.data);
    };
  }

  if (INSTANCE === 'delivery') {
    let pollCount = 0;
    const pollInterval = setInterval(() => {
      pollCount++;
      if (alreadyPrefilled || pollCount > 60) { clearInterval(pollInterval); return; }
      try {
        const raw = localStorage.getItem('address_main');
        if (raw) {
          const data = JSON.parse(raw);
          if (data && data.city) { applyPrefill(data); clearInterval(pollInterval); }
        }
      } catch (e) {}
    }, 500);
  }

  async function applyPrefill(data) {
    while (!citiesLoaded) await new Promise(r => setTimeout(r, 200));
    if (selectedCity && alreadyPrefilled) return;
    alreadyPrefilled = true;

    cityInput.value = data.city;
    selectedCity = data.city;
    cityInput.classList.add('valid');

    streetInput.disabled = false;
    streetInput.placeholder = 'טוען רחובות...';

    currentCityStreets = await loadStreetsForCity(data.city);

    streetInput.placeholder = 'הקלד שם רחוב...';

    if (data.street) {
      streetInput.value = data.street;
      selectedStreet = data.street;
      streetInput.classList.add('valid');
    }
    if (data.house) houseInput.value = data.house;
    if (data.apartment) apartmentInput.value = data.apartment;

    saveToStorage();
    updateStatus();
  }

  // =============================================
  // LOAD CITIES (light — only unique city names)
  // =============================================

  async function loadCities() {
    try {
      const citySet = new Set();
      let offset = 0;
      const limit = 32000;

      while (true) {
        const url = `${GOV_API}?resource_id=${STREETS_RESOURCE}&limit=${limit}&fields=שם_ישוב&offset=${offset}`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.success || data.result.records.length === 0) break;

        data.result.records.forEach(r => {
          const raw = r['שם_ישוב'] || '';
          const trimmed = raw.trim();
          if (trimmed) {
            citySet.add(trimmed);
            // Store the raw version for API filtering later
            if (!cityRawMap[trimmed]) cityRawMap[trimmed] = raw;
          }
        });

        if (data.result.records.length < limit) break;
        offset += limit;
      }

      allCities = [...citySet].sort();
      citiesLoaded = true;
      cityInput.disabled = false;
      cityInput.placeholder = 'הקלד שם עיר...';
      console.log(`[${INSTANCE}] Loaded ${allCities.length} cities`);
    } catch (err) {
      console.error('Failed to load cities:', err);
      cityInput.placeholder = 'שגיאה בטעינה, נסה לרענן';
    }
  }

  // =============================================
  // LOAD STREETS FOR SELECTED CITY
  // Uses raw city name + also fetches with q= as fallback
  // =============================================

  async function loadStreetsForCity(city) {
    const streetSet = new Set();

    try {
      // Try with raw name from map
      const rawName = cityRawMap[city] || city;

      // Method 1: Use filters with raw name
      const filters = JSON.stringify({ 'שם_ישוב': rawName });
      const url1 = `${GOV_API}?resource_id=${STREETS_RESOURCE}&limit=5000&fields=שם_רחוב&filters=${encodeURIComponent(filters)}`;
      
      const res1 = await fetch(url1);
      const data1 = await res1.json();

      if (data1.success && data1.result.records.length > 0) {
        data1.result.records.forEach(r => {
          const s = (r['שם_רחוב'] || '').trim();
          if (s && s !== 'None') streetSet.add(s);
        });
      }

      // Method 2: If no results, try with q= search and filter client-side
      if (streetSet.size === 0) {
        const url2 = `${GOV_API}?resource_id=${STREETS_RESOURCE}&limit=5000&q=${encodeURIComponent(city)}`;
        const res2 = await fetch(url2);
        const data2 = await res2.json();

        if (data2.success) {
          data2.result.records.forEach(r => {
            const recCity = (r['שם_ישוב'] || '').trim();
            const recStreet = (r['שם_רחוב'] || '').trim();
            // Client-side filter: city must match
            if (recCity === city && recStreet && recStreet !== 'None') {
              streetSet.add(recStreet);
            }
          });
        }
      }

      console.log(`[${INSTANCE}] Loaded ${streetSet.size} streets for "${city}"`);
    } catch (err) {
      console.error('Failed to load streets:', err);
    }

    currentCityStreets = [...streetSet].sort();
    return currentCityStreets;
  }

  // =============================================
  // FUZZY MATCH
  // =============================================

  function fuzzyMatch(items, query) {
    if (!query || query.length === 0) return items.slice(0, 50);
    const q = query.trim();

    const scored = items.map(item => {
      let score = 0;
      if (item === q) score = 100;
      else if (item.startsWith(q)) score = 80;
      else if (item.includes(q)) score = 60;
      else {
        const itemClean = item.replace(/[\s\-]/g, '');
        const qClean = q.replace(/[\s\-]/g, '');
        if (itemClean.includes(qClean)) score = 50;
        else {
          let matched = 0, pos = 0;
          for (const ch of qClean) {
            const idx = itemClean.indexOf(ch, pos);
            if (idx >= 0) { matched++; pos = idx + 1; }
          }
          if (qClean.length > 0 && matched / qClean.length >= 0.7) {
            score = Math.round((matched / qClean.length) * 40);
          }
        }
      }
      return { item, score };
    });

    return scored
      .filter(s => s.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 30)
      .map(s => s.item);
  }

  function highlightMatch(text, query) {
    if (!query) return text;
    const idx = text.indexOf(query);
    if (idx === -1) return text;
    return text.substring(0, idx)
      + '<span class="match">' + text.substring(idx, idx + query.length) + '</span>'
      + text.substring(idx + query.length);
  }

  // =============================================
  // UI
  // =============================================

  function showSuggestions(container, items, query, onSelect) {
    highlightIndex = -1;
    if (!items || items.length === 0) {
      container.innerHTML = '<div class="no-results">לא נמצאו תוצאות</div>';
      container.classList.add('active');
      return;
    }
    container.innerHTML = items
      .map((item, i) => `<div class="item" data-index="${i}">${highlightMatch(item, query)}</div>`)
      .join('');
    container.classList.add('active');
    container.querySelectorAll('.item').forEach((el, i) => {
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        onSelect(items[i]);
      });
    });
  }

  function hideSuggestions(container) {
    container.classList.remove('active');
    container.innerHTML = '';
    highlightIndex = -1;
  }

  function navigateSuggestions(container, direction) {
    const els = container.querySelectorAll('.item');
    if (els.length === 0) return;
    els.forEach(el => el.classList.remove('highlighted'));
    if (direction === 'down') highlightIndex = (highlightIndex + 1) % els.length;
    else highlightIndex = highlightIndex <= 0 ? els.length - 1 : highlightIndex - 1;
    els[highlightIndex].classList.add('highlighted');
    els[highlightIndex].scrollIntoView({ block: 'nearest' });
  }

  function updateStatus() {
    const data = getAddressData();
    if (data.isValid) {
      statusBar.className = 'status-bar success';
      statusBar.textContent = `✓ ${data.city}, ${data.street} ${data.house}${data.apartment ? ' דירה ' + data.apartment : ''}`;
    } else {
      statusBar.className = 'status-bar';
    }
  }

  // =============================================
  // CITY INPUT
  // =============================================

  cityInput.addEventListener('input', () => {
    const val = cityInput.value.trim();
    selectedCity = '';
    selectedStreet = '';
    currentCityStreets = [];
    streetInput.value = '';
    streetInput.disabled = true;
    streetInput.placeholder = 'בחר עיר קודם...';
    cityInput.classList.remove('valid');
    streetInput.classList.remove('valid');

    if (val.length < 1) { hideSuggestions(citySuggestions); saveToStorage(); updateStatus(); return; }

    const matches = fuzzyMatch(allCities, val);
    showSuggestions(citySuggestions, matches, val, selectCity);
    saveToStorage();
    updateStatus();
  });

  cityInput.addEventListener('focus', () => {
    const val = cityInput.value.trim();
    if (val.length >= 1 && allCities.length > 0) {
      const matches = fuzzyMatch(allCities, val);
      showSuggestions(citySuggestions, matches, val, selectCity);
    }
  });

  cityInput.addEventListener('keydown', (e) => {
    if (!citySuggestions.classList.contains('active')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); navigateSuggestions(citySuggestions, 'down'); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); navigateSuggestions(citySuggestions, 'up'); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const h = citySuggestions.querySelector('.item.highlighted');
      if (h) { const i = parseInt(h.dataset.index); const m = fuzzyMatch(allCities, cityInput.value.trim()); selectCity(m[i]); }
    }
    else if (e.key === 'Escape') hideSuggestions(citySuggestions);
  });

  cityInput.addEventListener('blur', () => setTimeout(() => hideSuggestions(citySuggestions), 200));

  async function selectCity(city) {
    selectedCity = city;
    cityInput.value = city;
    cityInput.classList.add('valid');
    hideSuggestions(citySuggestions);

    streetInput.disabled = false;
    streetInput.placeholder = 'טוען רחובות...';
    streetInput.value = '';

    await loadStreetsForCity(city);

    streetInput.placeholder = currentCityStreets.length > 0 ? 'הקלד שם רחוב...' : 'לא נמצאו רחובות';
    streetInput.focus();
    saveToStorage();
    updateStatus();
  }

  // =============================================
  // STREET INPUT
  // =============================================

  streetInput.addEventListener('input', () => {
    const val = streetInput.value.trim();
    selectedStreet = '';
    streetInput.classList.remove('valid');
    if (!selectedCity || currentCityStreets.length === 0) return;
    const matches = fuzzyMatch(currentCityStreets, val);
    showSuggestions(streetSuggestions, matches, val, selectStreet);
    saveToStorage();
    updateStatus();
  });

  streetInput.addEventListener('focus', () => {
    if (selectedCity && currentCityStreets.length > 0) {
      const val = streetInput.value.trim();
      const matches = fuzzyMatch(currentCityStreets, val);
      showSuggestions(streetSuggestions, matches, val, selectStreet);
    }
  });

  streetInput.addEventListener('keydown', (e) => {
    if (!streetSuggestions.classList.contains('active')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); navigateSuggestions(streetSuggestions, 'down'); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); navigateSuggestions(streetSuggestions, 'up'); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const h = streetSuggestions.querySelector('.item.highlighted');
      if (h) { const i = parseInt(h.dataset.index); const m = fuzzyMatch(currentCityStreets, streetInput.value.trim()); selectStreet(m[i]); }
    }
    else if (e.key === 'Escape') hideSuggestions(streetSuggestions);
  });

  streetInput.addEventListener('blur', () => setTimeout(() => hideSuggestions(streetSuggestions), 200));

  function selectStreet(street) {
    selectedStreet = street;
    streetInput.value = street;
    streetInput.classList.add('valid');
    hideSuggestions(streetSuggestions);
    houseInput.focus();
    saveToStorage();
    updateStatus();
  }

  // =============================================
  // HOUSE & APARTMENT
  // =============================================
  houseInput.addEventListener('input', () => { saveToStorage(); updateStatus(); });
  apartmentInput.addEventListener('input', () => { saveToStorage(); updateStatus(); });

  // =============================================
  // DATA GETTER
  // =============================================

  function getAddressData() {
    return {
      type: 'address_update',
      instance: INSTANCE,
      city: selectedCity || cityInput.value.trim(),
      street: selectedStreet || streetInput.value.trim(),
      house: houseInput.value.trim(),
      apartment: apartmentInput.value.trim(),
      isValid: !!(selectedCity && selectedStreet && houseInput.value.trim()),
      cityValidated: !!selectedCity,
      streetValidated: !!selectedStreet
    };
  }

  // Start
  loadCities();
</script>
</body>
</html>
