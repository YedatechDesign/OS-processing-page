<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כתובת למשלוח</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Heebo', sans-serif; background: transparent; direction: rtl; }
    .address-widget { max-width: 100%; padding: 4px 0; }
    .field-group { margin-bottom: 14px; position: relative; }
    .field-group label { display: block; font-size: 15px; font-weight: 700; color: #1f1f1f; margin-bottom: 6px; }
    .field-group label .required { color: #e63946; margin-right: 2px; }
    .field-group input {
      width: 100%; padding: 8px 18px; border: 1px solid transparent; border-radius: 999px;
      font-size: 15px; font-family: 'Heebo', sans-serif; color: #1f1f1f; background: #e0e6f0;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s; outline: none;
      -webkit-appearance: none; appearance: none;
    }
    .field-group input:focus { border-color: #8b9dc3; background: #f0f3fa; box-shadow: 0 0 0 2px rgba(139,157,195,0.15); }
    .field-group input.valid { border-color: #2ecc71; background: #edf9f0; }
    .field-group input::placeholder { color: #8b95a5; font-weight: 400; }
    .suggestions {
      position: absolute; top: 100%; right: 0; left: 0; background: #fff;
      border: 1px solid #c5cad3; border-radius: 14px;
      max-height: 200px; overflow-y: auto; z-index: 1000; display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12); margin-top: 4px;
    }
    .suggestions.active { display: block; }
    .suggestions .item {
      padding: 10px 16px; cursor: pointer; font-size: 14px; color: #1f1f1f;
      border-bottom: 1px solid #f0f0f0; transition: background 0.15s;
    }
    .suggestions .item:hover, .suggestions .item.highlighted { background: #eef2fb; }
    .suggestions .item:last-child { border-bottom: none; }
    .suggestions .item .match { font-weight: 700; color: #3b5998; }
    .suggestions .no-results { padding: 12px 16px; color: #999; font-size: 13px; text-align: center; }
    .suggestions .loading-item { padding: 12px 16px; color: #8b95a5; font-size: 13px; text-align: center; }
    .status-bar { margin-top: 10px; padding: 8px 12px; border-radius: 8px; font-size: 13px; display: none; }
    .status-bar.success { display: block; background: #edf9f0; color: #2d6a4f; border: 1px solid #b7e4c7; }
    .field-hint { font-size: 12px; color: #6b7280; margin-top: 4px; padding-right: 2px; }
    .field-error { font-size: 12px; color: #e63946; margin-top: 4px; padding-right: 2px; display: none; }
    .field-error.show { display: block; }
    .field-group input.invalid { border-color: #e63946; background: #fef2f2; }
    .suggestions::-webkit-scrollbar { width: 6px; }
    .suggestions::-webkit-scrollbar-track { background: transparent; }
    .suggestions::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  </style>
</head>
<body>
<div class="address-widget">
  <div class="field-group">
    <label><span class="required">*</span> מייל לאימות</label>
    <input type="text" id="emailInput" placeholder="הזן מייל" autocomplete="email" />
    <div class="field-hint">יש לוודא שהמייל זהה למייל שהוזן בטופס</div>
  </div>
  <div class="field-group">
    <label><span class="required">*</span> עיר / יישוב</label>
    <input type="text" id="cityInput" placeholder="הקלד שם עיר..." autocomplete="off" />
    <div class="suggestions" id="citySuggestions"></div>
    <div class="field-error" id="cityError"></div>
  </div>
  <div class="field-group">
    <label><span class="required">*</span> רחוב</label>
    <input type="text" id="streetInput" placeholder="בחר עיר קודם..." autocomplete="off" disabled />
    <div class="suggestions" id="streetSuggestions"></div>
    <div class="field-error" id="streetError"></div>
  </div>
  <div class="status-bar" id="statusBar"></div>
</div>

<script>
  var GOV_API = 'https://data.gov.il/api/3/action/datastore_search';
  var STREETS_RESOURCE = '9ad3862c-8391-4b2f-84a4-2d4c68625f4b';
  var SAVE_WEBHOOK = 'https://yedauto.com/webhook/save-address';

  var allCities = [];
  var allRecords = [];
  var currentCityStreets = [];
  var selectedEmail = '';
  var selectedCity = '';
  var selectedStreet = '';
  var highlightIndex = -1;
  var dataLoaded = false;
  var lastSavedHash = '';
  var saveTimer = null;
  var searchTimer = null;

  var emailInput = document.getElementById('emailInput');
  var cityInput = document.getElementById('cityInput');
  var streetInput = document.getElementById('streetInput');
  var citySuggestions = document.getElementById('citySuggestions');
  var streetSuggestions = document.getElementById('streetSuggestions');
  var statusBar = document.getElementById('statusBar');

  function isValidEmail(e) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  }

  emailInput.addEventListener('blur', function() {
    var v = emailInput.value.trim().toLowerCase();
    if (v && isValidEmail(v)) {
      selectedEmail = v;
      emailInput.value = v;
      emailInput.classList.add('valid');
      emailInput.classList.remove('invalid');
      trySave();
    } else if (v) {
      emailInput.classList.add('invalid');
      emailInput.classList.remove('valid');
      selectedEmail = '';
    } else {
      emailInput.classList.remove('valid','invalid');
      selectedEmail = '';
    }
  });

  emailInput.addEventListener('input', function() {
    selectedEmail = '';
    emailInput.classList.remove('valid','invalid');
  });

  // =============================================
  // SAVE TO N8N WEBHOOK
  // =============================================

  function getCurrentValues() {
    return {
      email: (selectedEmail || '').trim().toLowerCase(),
      city: (selectedCity || '').trim(),
      street: (selectedStreet || '').trim()
    };
  }

  function showCityError(msg) {
    var el = document.getElementById('cityError');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideCityError() { document.getElementById('cityError').classList.remove('show'); }
  function showStreetError(msg) {
    var el = document.getElementById('streetError');
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideStreetError() { document.getElementById('streetError').classList.remove('show'); }

  function trySave() {
    var data = getCurrentValues();
    if (!data.email || !data.city || !data.street) return;
    if (!isValidEmail(data.email)) return;
    var hash = JSON.stringify(data);
    if (hash === lastSavedHash) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function() {
      lastSavedHash = hash;
      fetch(SAVE_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
        keepalive: true
      }).catch(function(e) { lastSavedHash = ''; });
    }, 200);
  }

  // sendBeacon as last-ditch save when iframe is being unloaded
  // (e.g. parent Tally form navigates away after submission)
  function flushSave() {
    var data = getCurrentValues();
    if (!data.email || !data.city || !data.street) return;
    if (!isValidEmail(data.email)) return;
    var hash = JSON.stringify(data);
    if (hash === lastSavedHash) return;
    lastSavedHash = hash;
    try {
      var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      navigator.sendBeacon(SAVE_WEBHOOK, blob);
    } catch (e) { /* ignore */ }
  }
  window.addEventListener('pagehide', flushSave);
  window.addEventListener('beforeunload', flushSave);
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden') flushSave();
  });

  // City blur: must have selected from dropdown — otherwise clear + red
  cityInput.addEventListener('blur', function() {
    setTimeout(function() {
      var v = cityInput.value.trim();
      if (!v) { hideCityError(); return; }
      if (selectedCity && v === selectedCity) {
        hideCityError();
        cityInput.classList.add('valid');
        cityInput.classList.remove('invalid');
      } else {
        cityInput.value = '';
        selectedCity = '';
        cityInput.classList.add('invalid');
        cityInput.classList.remove('valid');
        showCityError('יש לבחור עיר מהרשימה.');
        // Reset street since city is gone
        streetInput.value = '';
        streetInput.disabled = true;
        streetInput.placeholder = 'בחר עיר קודם...';
        streetInput.classList.remove('valid','invalid');
        selectedStreet = '';
        hideStreetError();
      }
    }, 200);
  });

  // Street blur: must have selected from dropdown — otherwise clear + red
  streetInput.addEventListener('blur', function() {
    setTimeout(function() {
      var v = streetInput.value.trim();
      if (!v) { hideStreetError(); return; }
      if (selectedStreet && v === selectedStreet) {
        hideStreetError();
        streetInput.classList.add('valid');
        streetInput.classList.remove('invalid');
      } else {
        streetInput.value = '';
        selectedStreet = '';
        streetInput.classList.add('invalid');
        streetInput.classList.remove('valid');
        showStreetError('יש לבחור רחוב מהרשימה.');
      }
    }, 200);
  });

  // =============================================
  // API SEARCH (used while full data loads)
  // =============================================

  async function apiSearchCities(query) {
    try {
      var url = GOV_API + '?resource_id=' + STREETS_RESOURCE + '&limit=100&fields=שם_ישוב&q=' + encodeURIComponent(query);
      var res = await fetch(url);
      var data = await res.json();
      if (!data.success) return [];
      var set = new Set();
      data.result.records.forEach(function(r) {
        var c = (r['שם_ישוב'] || '').trim();
        if (c) set.add(c);
      });
      return Array.from(set).sort();
    } catch(e) { return []; }
  }

  async function apiSearchStreets(city, query) {
    try {
      var filters = JSON.stringify({'שם_ישוב': city});
      var url = GOV_API + '?resource_id=' + STREETS_RESOURCE + '&limit=500&fields=שם_רחוב&filters=' + encodeURIComponent(filters);
      if (query) url += '&q=' + encodeURIComponent(query);
      var res = await fetch(url);
      var data = await res.json();
      if (!data.success) return [];
      var set = new Set();
      data.result.records.forEach(function(r) {
        var s = (r['שם_רחוב'] || '').trim();
        if (s && s !== 'None') set.add(s);
      });
      return Array.from(set).sort();
    } catch(e) { return []; }
  }

  // =============================================
  // LOAD FULL DATA IN BACKGROUND
  // =============================================

  async function fetchR(url, retries) {
    retries = retries || 3;
    for (var i = 0; i < retries; i++) {
      try { var r = await fetch(url); if (r.ok) return r; } catch(e) { if (i < retries-1) await new Promise(function(r){setTimeout(r,1000*(i+1));}); }
    }
    throw new Error('Failed');
  }

  async function loadAllData() {
    try {
      var citySet = new Set(); var records = []; var offset = 0; var limit = 10000;
      while (true) {
        var url = GOV_API + '?resource_id=' + STREETS_RESOURCE + '&limit=' + limit + '&fields=שם_ישוב,שם_רחוב&offset=' + offset;
        var res = await fetchR(url, 3); var data = await res.json();
        if (!data.success || !data.result.records || data.result.records.length === 0) break;
        for (var j = 0; j < data.result.records.length; j++) {
          var r = data.result.records[j];
          var tc = (r['שם_ישוב'] || '').trim(); var ts = (r['שם_רחוב'] || '').trim();
          if (tc) citySet.add(tc);
          if (tc && ts && ts !== 'None') records.push({ city: tc, street: ts });
        }
        if (data.result.records.length < limit) break;
        offset += limit;
      }
      allRecords = records; allCities = Array.from(citySet).sort(); dataLoaded = true;
      console.log('Data loaded: ' + allCities.length + ' cities, ' + allRecords.length + ' streets');
    } catch (err) {
      console.error('Background load failed:', err);
    }
  }

  function getStreets(city) {
    var s = new Set();
    for (var i = 0; i < allRecords.length; i++) if (allRecords[i].city === city) s.add(allRecords[i].street);
    return Array.from(s).sort();
  }

  // =============================================
  // FUZZY MATCH (local)
  // =============================================

  function fuzzy(items, q) {
    if (!q || q.length === 0) return items.slice(0, 50);
    q = q.trim(); var scored = [];
    for (var i = 0; i < items.length; i++) {
      var item = items[i], score = 0;
      if (item === q) score = 100;
      else if (item.startsWith(q)) score = 80;
      else if (item.includes(q)) score = 60;
      else { var ic=item.replace(/[\s\-]/g,''),qc=q.replace(/[\s\-]/g,''); if(ic.includes(qc)) score=50; else { var m=0,p=0; for(var c=0;c<qc.length;c++){var idx=ic.indexOf(qc[c],p);if(idx>=0){m++;p=idx+1;}} if(qc.length>0&&m/qc.length>=0.7) score=Math.round((m/qc.length)*40); } }
      if (score > 0) scored.push({ item: item, score: score });
    }
    scored.sort(function(a,b){return b.score-a.score;});
    return scored.slice(0,30).map(function(s){return s.item;});
  }

  function hl(t,q) { if(!q)return t; var i=t.indexOf(q); if(i===-1)return t; return t.substring(0,i)+'<span class="match">'+t.substring(i,i+q.length)+'</span>'+t.substring(i+q.length); }

  // =============================================
  // SEARCH — uses local data if loaded, API otherwise
  // =============================================

  async function searchCities(query) {
    if (dataLoaded) {
      return fuzzy(allCities, query);
    } else {
      return await apiSearchCities(query);
    }
  }

  async function searchStreets(city, query) {
    if (dataLoaded) {
      if (currentCityStreets.length === 0) currentCityStreets = getStreets(city);
      return fuzzy(currentCityStreets, query);
    } else {
      return await apiSearchStreets(city, query);
    }
  }

  // =============================================
  // UI
  // =============================================

  function showS(c,items,q,onSel) {
    highlightIndex=-1;
    if(!items||items.length===0){c.innerHTML='<div class="no-results">לא נמצאו תוצאות</div>';c.classList.add('active');return;}
    var h='';for(var i=0;i<items.length;i++) h+='<div class="item" data-index="'+i+'">'+hl(items[i],q)+'</div>';
    c.innerHTML=h;c.classList.add('active');
    var els=c.querySelectorAll('.item');
    for(var j=0;j<els.length;j++)(function(idx){els[idx].addEventListener('mousedown',function(e){e.preventDefault();onSel(items[idx]);});})(j);
  }
  function showLoading(c) { c.innerHTML='<div class="loading-item">טוען...</div>'; c.classList.add('active'); }
  function hideS(c){c.classList.remove('active');c.innerHTML='';highlightIndex=-1;}
  function navS(c,dir){var els=c.querySelectorAll('.item');if(!els.length)return;for(var i=0;i<els.length;i++)els[i].classList.remove('highlighted');if(dir==='down')highlightIndex=(highlightIndex+1)%els.length;else highlightIndex=highlightIndex<=0?els.length-1:highlightIndex-1;els[highlightIndex].classList.add('highlighted');els[highlightIndex].scrollIntoView({block:'nearest'});}

  function updateStatus() {
    if (selectedEmail && selectedCity && selectedStreet) {
      statusBar.className = 'status-bar success';
      statusBar.textContent = '✓ ' + selectedCity + ', ' + selectedStreet;
    } else {
      statusBar.className = 'status-bar';
    }
  }

  // =============================================
  // CITY
  // =============================================

  cityInput.addEventListener('input', function() {
    selectedCity='';selectedStreet='';currentCityStreets=[];streetInput.value='';streetInput.disabled=true;streetInput.placeholder='בחר עיר קודם...';
    cityInput.classList.remove('valid','invalid');
    streetInput.classList.remove('valid','invalid');
    hideCityError();hideStreetError();
    var v=cityInput.value.trim();
    if(v.length<1){hideS(citySuggestions);updateStatus();return;}

    clearTimeout(searchTimer);
    if (dataLoaded) {
      showS(citySuggestions,fuzzy(allCities,v),v,selectCity);
    } else {
      showLoading(citySuggestions);
      searchTimer = setTimeout(async function() {
        var results = await apiSearchCities(v);
        if (cityInput.value.trim() === v) {
          showS(citySuggestions,results,v,selectCity);
        }
      }, 300);
    }
    updateStatus();
  });

  cityInput.addEventListener('focus',function(){
    var v=cityInput.value.trim();
    if(v.length>=1) {
      if (dataLoaded) {
        showS(citySuggestions,fuzzy(allCities,v),v,selectCity);
      }
    }
  });

  cityInput.addEventListener('keydown',function(e){if(!citySuggestions.classList.contains('active'))return;if(e.key==='ArrowDown'){e.preventDefault();navS(citySuggestions,'down');}else if(e.key==='ArrowUp'){e.preventDefault();navS(citySuggestions,'up');}else if(e.key==='Enter'){e.preventDefault();var h=citySuggestions.querySelector('.item.highlighted');if(h){var items=citySuggestions.querySelectorAll('.item');var idx=parseInt(h.dataset.index);var text=items[idx]?items[idx].textContent:'';if(text)selectCity(text);}}else if(e.key==='Escape')hideS(citySuggestions);});
  cityInput.addEventListener('blur',function(){setTimeout(function(){hideS(citySuggestions);},200);});

  function selectCity(city) {
    selectedCity=city;cityInput.value=city;cityInput.classList.add('valid');hideS(citySuggestions);
    if (dataLoaded) {
      currentCityStreets=getStreets(city);
    }
    streetInput.disabled=false;streetInput.placeholder='הקלד שם רחוב...';streetInput.value='';streetInput.focus();
    updateStatus();
  }

  // =============================================
  // STREET
  // =============================================

  streetInput.addEventListener('input',function(){
    selectedStreet='';
    streetInput.classList.remove('valid','invalid');
    hideStreetError();
    if(!selectedCity)return;
    var v=streetInput.value.trim();

    clearTimeout(searchTimer);
    if (dataLoaded) {
      if (currentCityStreets.length === 0) currentCityStreets = getStreets(selectedCity);
      showS(streetSuggestions,fuzzy(currentCityStreets,v),v,selectStreet);
    } else {
      showLoading(streetSuggestions);
      searchTimer = setTimeout(async function() {
        var results = await apiSearchStreets(selectedCity, v);
        if (streetInput.value.trim() === v) {
          showS(streetSuggestions,results,v,selectStreet);
        }
      }, 300);
    }
    updateStatus();
  });

  streetInput.addEventListener('focus',function(){
    if(!selectedCity) return;
    var v=streetInput.value.trim();
    if (dataLoaded) {
      if (currentCityStreets.length === 0) currentCityStreets = getStreets(selectedCity);
      showS(streetSuggestions,fuzzy(currentCityStreets,v),v,selectStreet);
    }
  });

  streetInput.addEventListener('keydown',function(e){if(!streetSuggestions.classList.contains('active'))return;if(e.key==='ArrowDown'){e.preventDefault();navS(streetSuggestions,'down');}else if(e.key==='ArrowUp'){e.preventDefault();navS(streetSuggestions,'up');}else if(e.key==='Enter'){e.preventDefault();var h=streetSuggestions.querySelector('.item.highlighted');if(h){var items=streetSuggestions.querySelectorAll('.item');var idx=parseInt(h.dataset.index);var text=items[idx]?items[idx].textContent:'';if(text)selectStreet(text);}}else if(e.key==='Escape')hideS(streetSuggestions);});
  streetInput.addEventListener('blur',function(){setTimeout(function(){hideS(streetSuggestions);},200);});

  function selectStreet(street) {
    selectedStreet=street;streetInput.value=street;streetInput.classList.add('valid');hideS(streetSuggestions);
    trySave();updateStatus();
  }

  // Start loading in background — input is available immediately
  loadAllData();
</script>
</body>
</html>
