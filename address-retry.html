<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ההזמנה לא הושלמה</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Heebo', sans-serif;
      background: linear-gradient(135deg, #0a2351 0%, #1e3a6f 50%, #2d4a7c 100%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      padding: 20px; direction: rtl;
    }
    .container {
      background: white; padding: 50px 40px; border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4); max-width: 520px; width: 100%;
      border-top: 6px solid #00bcd4; text-align: center;
    }
    h1 { color: #0a2351; font-size: 28px; margin-bottom: 18px; font-weight: 700; }
    p { color: #555; font-size: 16px; line-height: 1.7; margin-bottom: 12px; }
    p:last-child { margin-bottom: 0; }
    @media (max-width: 480px) {
      .container { padding: 36px 24px; }
      h1 { font-size: 24px; }
      p { font-size: 15px; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>ההזמנה לא הושלמה</h1>
  <p>לא הצלחנו לאתר את הכתובת שלך.</p>
  <p>ייתכן שהכתובת לא הוזנה בטופס, או שהמייל אינו תואם.</p>
  <p>ניתן להזמין מחדש. אם זה לא יעבוד — צוות אורין שפלטר יצור איתך קשר בהקדם.</p>
</div>
</body>
</html>
