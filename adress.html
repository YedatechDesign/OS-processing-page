<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כתובת למשלוח</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Heebo', sans-serif;
      background: transparent;
      direction: rtl;
    }

    .address-widget {
      max-width: 100%;
      padding: 8px 4px;
    }

    .field-group {
      margin-bottom: 14px;
      position: relative;
    }

    .field-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #1a1a2e;
      margin-bottom: 5px;
    }

    .field-group label .required {
      color: #e63946;
      margin-right: 2px;
    }

    .field-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d0d5dd;
      border-radius: 8px;
      font-size: 15px;
      font-family: 'Heebo', sans-serif;
      color: #1a1a2e;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field-group input:focus {
      border-color: #0a59eb;
      box-shadow: 0 0 0 3px rgba(10, 89, 235, 0.1);
    }

    .field-group input.valid {
      border-color: #2ecc71;
      background: #f0fff4;
    }

    .field-group input.invalid {
      border-color: #e63946;
      background: #fff5f5;
    }

    .field-group input::placeholder {
      color: #a0a0b0;
      font-weight: 300;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .field-group {
      flex: 1;
    }

    .row .field-group.small {
      flex: 0 0 100px;
    }

    /* Autocomplete dropdown */
    .suggestions {
      position: absolute;
      top: 100%;
      right: 0;
      left: 0;
      background: #fff;
      border: 1.5px solid #d0d5dd;
      border-top: none;
      border-radius: 0 0 8px 8px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .suggestions.active {
      display: block;
    }

    .suggestions .item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      color: #1a1a2e;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.15s;
    }

    .suggestions .item:hover,
    .suggestions .item.highlighted {
      background: #eef4ff;
    }

    .suggestions .item:last-child {
      border-bottom: none;
    }

    .suggestions .no-results {
      padding: 12px 14px;
      color: #999;
      font-size: 13px;
      text-align: center;
    }

    .suggestions .loading {
      padding: 12px 14px;
      color: #666;
      font-size: 13px;
      text-align: center;
    }

    /* Status bar */
    .status-bar {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }

    .status-bar.success {
      display: block;
      background: #f0fff4;
      color: #2d6a4f;
      border: 1px solid #b7e4c7;
    }

    .status-bar.error {
      display: block;
      background: #fff5f5;
      color: #c1121f;
      border: 1px solid #f4a4a4;
    }

    /* Scrollbar */
    .suggestions::-webkit-scrollbar { width: 6px; }
    .suggestions::-webkit-scrollbar-track { background: transparent; }
    .suggestions::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    @media (max-width: 400px) {
      .row { flex-direction: column; gap: 0; }
      .row .field-group.small { flex: 1; }
    }
  </style>
</head>
<body>

<div class="address-widget" id="addressWidget">
  <!-- City -->
  <div class="field-group">
    <label><span class="required">*</span> עיר / יישוב</label>
    <input
      type="text"
      id="cityInput"
      placeholder="הקלד שם עיר..."
      autocomplete="off"
    />
    <div class="suggestions" id="citySuggestions"></div>
  </div>

  <!-- Street -->
  <div class="field-group">
    <label><span class="required">*</span> רחוב</label>
    <input
      type="text"
      id="streetInput"
      placeholder="בחר עיר קודם..."
      autocomplete="off"
      disabled
    />
    <div class="suggestions" id="streetSuggestions"></div>
  </div>

  <!-- House + Apartment row -->
  <div class="row">
    <div class="field-group">
      <label><span class="required">*</span> מספר בית</label>
      <input
        type="text"
        id="houseInput"
        placeholder="מספר בית"
        autocomplete="off"
      />
    </div>
    <div class="field-group small">
      <label>דירה</label>
      <input
        type="text"
        id="apartmentInput"
        placeholder="דירה"
        autocomplete="off"
      />
    </div>
  </div>

  <div class="status-bar" id="statusBar"></div>
</div>

<script>
  // =============================================
  // CONFIG
  // =============================================
  const GOV_API = 'https://data.gov.il/api/3/action/datastore_search';
  const STREETS_RESOURCE = '9ad3862c-8391-4b2f-84a4-2d4c68625f4b';

  // State
  let selectedCity = '';
  let selectedStreet = '';
  let cityCache = {};
  let streetCache = {};
  let debounceTimer = null;
  let highlightIndex = -1;

  // Elements
  const cityInput = document.getElementById('cityInput');
  const streetInput = document.getElementById('streetInput');
  const houseInput = document.getElementById('houseInput');
  const apartmentInput = document.getElementById('apartmentInput');
  const citySuggestions = document.getElementById('citySuggestions');
  const streetSuggestions = document.getElementById('streetSuggestions');
  const statusBar = document.getElementById('statusBar');

  // =============================================
  // GOV.IL API
  // =============================================

  async function searchCities(query) {
    if (!query || query.length < 2) return [];
    
    const cacheKey = query.trim();
    if (cityCache[cacheKey]) return cityCache[cacheKey];

    try {
      const url = `${GOV_API}?resource_id=${STREETS_RESOURCE}&limit=500&fields=שם_ישוב&q=${encodeURIComponent(query)}`;
      const res = await fetch(url);
      const data = await res.json();

      if (!data.success) return [];

      // Extract unique city names
      const cities = [...new Set(
        data.result.records
          .map(r => (r['שם_ישוב'] || '').trim())
          .filter(Boolean)
      )].sort();

      cityCache[cacheKey] = cities;
      return cities;
    } catch (err) {
      console.error('City search error:', err);
      return [];
    }
  }

  async function searchStreets(city, query) {
    if (!city) return [];

    const cacheKey = `${city}__${(query || '').trim()}`;
    if (streetCache[cacheKey]) return streetCache[cacheKey];

    try {
      const filters = JSON.stringify({ 'שם_ישוב': city });
      let url = `${GOV_API}?resource_id=${STREETS_RESOURCE}&limit=1000&fields=שם_רחוב&filters=${encodeURIComponent(filters)}`;
      if (query && query.length >= 1) {
        url += `&q=${encodeURIComponent(query)}`;
      }

      const res = await fetch(url);
      const data = await res.json();

      if (!data.success) return [];

      const streets = [...new Set(
        data.result.records
          .map(r => (r['שם_רחוב'] || '').trim())
          .filter(Boolean)
          .filter(s => s !== 'None' && s !== '')
      )].sort();

      streetCache[cacheKey] = streets;
      return streets;
    } catch (err) {
      console.error('Street search error:', err);
      return [];
    }
  }

  // =============================================
  // UI HELPERS
  // =============================================

  function showSuggestions(container, items, onSelect) {
    highlightIndex = -1;
    
    if (!items || items.length === 0) {
      container.innerHTML = '<div class="no-results">לא נמצאו תוצאות</div>';
      container.classList.add('active');
      return;
    }

    container.innerHTML = items
      .map((item, i) => `<div class="item" data-index="${i}">${item}</div>`)
      .join('');
    container.classList.add('active');

    container.querySelectorAll('.item').forEach(el => {
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        onSelect(el.textContent);
      });
    });
  }

  function hideSuggestions(container) {
    container.classList.remove('active');
    container.innerHTML = '';
    highlightIndex = -1;
  }

  function showLoading(container) {
    container.innerHTML = '<div class="loading">מחפש...</div>';
    container.classList.add('active');
  }

  function navigateSuggestions(container, direction) {
    const items = container.querySelectorAll('.item');
    if (items.length === 0) return null;

    items.forEach(el => el.classList.remove('highlighted'));

    if (direction === 'down') {
      highlightIndex = (highlightIndex + 1) % items.length;
    } else {
      highlightIndex = highlightIndex <= 0 ? items.length - 1 : highlightIndex - 1;
    }

    items[highlightIndex].classList.add('highlighted');
    items[highlightIndex].scrollIntoView({ block: 'nearest' });
    return items[highlightIndex].textContent;
  }

  function debounce(fn, delay = 250) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(fn, delay);
  }

  // =============================================
  // CITY INPUT
  // =============================================

  cityInput.addEventListener('input', () => {
    const val = cityInput.value.trim();
    selectedCity = '';
    selectedStreet = '';
    streetInput.value = '';
    streetInput.disabled = true;
    streetInput.placeholder = 'בחר עיר קודם...';
    cityInput.classList.remove('valid', 'invalid');
    streetInput.classList.remove('valid', 'invalid');

    if (val.length < 2) {
      hideSuggestions(citySuggestions);
      sendAddress();
      return;
    }

    showLoading(citySuggestions);

    debounce(async () => {
      const cities = await searchCities(val);
      const filtered = cities.filter(c =>
        c.includes(val) || c.startsWith(val)
      );
      showSuggestions(citySuggestions, filtered, selectCity);
    }, 300);
  });

  cityInput.addEventListener('keydown', (e) => {
    if (!citySuggestions.classList.contains('active')) return;
    
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      navigateSuggestions(citySuggestions, 'down');
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      navigateSuggestions(citySuggestions, 'up');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const highlighted = citySuggestions.querySelector('.item.highlighted');
      if (highlighted) {
        selectCity(highlighted.textContent);
      }
    } else if (e.key === 'Escape') {
      hideSuggestions(citySuggestions);
    }
  });

  cityInput.addEventListener('blur', () => {
    setTimeout(() => hideSuggestions(citySuggestions), 200);
  });

  function selectCity(city) {
    selectedCity = city;
    cityInput.value = city;
    cityInput.classList.add('valid');
    hideSuggestions(citySuggestions);

    // Enable street
    streetInput.disabled = false;
    streetInput.placeholder = 'הקלד שם רחוב...';
    streetInput.value = '';
    streetInput.focus();

    // Preload streets
    searchStreets(city, '');
    sendAddress();
  }

  // =============================================
  // STREET INPUT
  // =============================================

  streetInput.addEventListener('input', () => {
    const val = streetInput.value.trim();
    selectedStreet = '';
    streetInput.classList.remove('valid', 'invalid');

    if (!selectedCity) return;

    showLoading(streetSuggestions);

    debounce(async () => {
      const streets = await searchStreets(selectedCity, val);
      const filtered = val.length > 0
        ? streets.filter(s => s.includes(val) || s.startsWith(val))
        : streets;
      showSuggestions(streetSuggestions, filtered, selectStreet);
    }, 300);
  });

  streetInput.addEventListener('focus', () => {
    if (selectedCity && !streetInput.value) {
      showLoading(streetSuggestions);
      debounce(async () => {
        const streets = await searchStreets(selectedCity, '');
        showSuggestions(streetSuggestions, streets, selectStreet);
      }, 200);
    }
  });

  streetInput.addEventListener('keydown', (e) => {
    if (!streetSuggestions.classList.contains('active')) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      navigateSuggestions(streetSuggestions, 'down');
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      navigateSuggestions(streetSuggestions, 'up');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const highlighted = streetSuggestions.querySelector('.item.highlighted');
      if (highlighted) {
        selectStreet(highlighted.textContent);
      }
    } else if (e.key === 'Escape') {
      hideSuggestions(streetSuggestions);
    }
  });

  streetInput.addEventListener('blur', () => {
    setTimeout(() => hideSuggestions(streetSuggestions), 200);
  });

  function selectStreet(street) {
    selectedStreet = street;
    streetInput.value = street;
    streetInput.classList.add('valid');
    hideSuggestions(streetSuggestions);
    houseInput.focus();
    sendAddress();
  }

  // =============================================
  // HOUSE & APARTMENT
  // =============================================

  houseInput.addEventListener('input', () => sendAddress());
  apartmentInput.addEventListener('input', () => sendAddress());

  // =============================================
  // SEND DATA TO PARENT
  // =============================================

  function getAddressData() {
    return {
      type: 'address_update',
      city: selectedCity || cityInput.value.trim(),
      street: selectedStreet || streetInput.value.trim(),
      house: houseInput.value.trim(),
      apartment: apartmentInput.value.trim(),
      isValid: !!(selectedCity && selectedStreet && houseInput.value.trim()),
      cityValidated: !!selectedCity,
      streetValidated: !!selectedStreet
    };
  }

  function sendAddress() {
    const data = getAddressData();

    // Send to parent window (for iframe embed)
    if (window.parent !== window) {
      window.parent.postMessage(data, '*');
    }

    // Update status
    if (data.isValid) {
      statusBar.className = 'status-bar success';
      statusBar.textContent = `✓ ${data.city}, ${data.street} ${data.house}${data.apartment ? ' דירה ' + data.apartment : ''}`;
    } else {
      statusBar.className = 'status-bar';
    }
  }

  // =============================================
  // RECEIVE CONFIG FROM PARENT
  // =============================================

  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'prefill_address') {
      if (e.data.city) {
        cityInput.value = e.data.city;
        selectedCity = e.data.city;
        cityInput.classList.add('valid');
        streetInput.disabled = false;
        streetInput.placeholder = 'הקלד שם רחוב...';
      }
      if (e.data.street) {
        streetInput.value = e.data.street;
        selectedStreet = e.data.street;
        streetInput.classList.add('valid');
      }
      if (e.data.house) houseInput.value = e.data.house;
      if (e.data.apartment) apartmentInput.value = e.data.apartment;
      sendAddress();
    }
  });

  // =============================================
  // URL PARAMS (for standalone usage)
  // =============================================

  (function initFromURL() {
    const params = new URLSearchParams(window.location.search);
    const instanceId = params.get('instance') || 'default';
    
    // Store instance ID for differentiation
    document.getElementById('addressWidget').dataset.instance = instanceId;
  })();
</script>

</body>
</html>
